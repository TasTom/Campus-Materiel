spring.application.name=campus-materiel

# L'application ne doit etre accessible que depuis la machine locale (TP).
server.address=127.0.0.1

# Persistance locale en mode fichier : les donnees survivent au redemarrage (RG-08).
# Le dossier data/ est exclu du depot Git (voir .gitignore).
spring.datasource.url=jdbc:h2:file:./data/campus-materiel
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Pour ce TP, "update" simplifie la gestion du schema.
# Les migrations versionnees (Flyway/Liquibase) feraient l'objet d'un approfondissement.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console H2 locale, utile pour verifier les donnees pendant le developpement.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Messages et dates affiches en francais, quelle que soit la langue du navigateur.
# Sans "fixed", Spring choisirait la langue annoncee par le navigateur et les dates
# s'afficheraient en anglais, alors que la constitution impose des libelles francais.
spring.web.locale=fr_FR
spring.web.locale-resolver=fixed

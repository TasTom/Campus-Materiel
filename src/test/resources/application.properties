# Configuration des tests : base en memoire, jamais la base locale de developpement.
# Chaque execution de test repart donc d'une base vide : les scenarios T01 a T12
# sont reproductibles et independants.
spring.datasource.url=jdbc:h2:mem:campus-materiel-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.h2.console.enabled=false
